<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Inspection Details</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <link
    rel="stylesheet"
    href="/css/details.css"
  >
</head>

<body>

  <main class="phone">

    <header class="topbar details-head">

      <button
        class="icon-btn"
        onclick="location.href='/history'"
        aria-label="Back"
      >
        ←
      </button>


      <h1>
        INSPECTION DETAILS
      </h1>


      <button
        id="removeInspectionBtn"
        class="remove-inspection-btn"
        aria-label="Remove inspection"
        title="Remove from history"
      >
        🗑
      </button>

    </header>


    <section
      id="details"
      class="page"
    ></section>

  </main>


  <script src="/js/details.js"></script>

</body>

</html>
