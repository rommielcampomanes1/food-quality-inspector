<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Food Quality Inspector</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>

    /* =========================================================
       HOMEPAGE BACKGROUND
    ========================================================= */

    .home {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      text-align: center;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,.97) 0%,
          rgba(255,255,255,.94) 26%,
          rgba(246,250,243,.78) 43%,
          rgba(241,248,238,.30) 58%,
          rgba(255,255,255,.02) 78%
        ),
        url('/images/homepage.png')
        center bottom / cover
        no-repeat;
    }


    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .home-content {
      position: relative;
      z-index: 2;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 52px 20px 18px;
    }


    /* =========================================================
       BRAND / LOGO
    ========================================================= */

    .brand {
      width: 100%;
      color: #075b35;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;

      display: block;
      flex-shrink: 0;
    }

    .brand-text {
      text-align: left;
    }

    .brand-main {
      margin: 0;

      color: #064b30;

      font-size: 28px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: .4px;
    }

    .brand-sub {
      margin-top: 7px;

      color: #3b913c;

      font-size: 18px;
      line-height: 1;

      font-weight: 600;

      letter-spacing: 7px;
    }


    /* =========================================================
       DIVIDER
    ========================================================= */

    .divider {
      width: 235px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 14px;

      margin: 20px auto 13px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;
      flex: 1;

      background: #5b9d78;
    }

    .leaf {
      color: #19864c;

      font-size: 21px;
      line-height: 1;
    }


    /* =========================================================
       TAGLINE
    ========================================================= */

    .tagline {
      margin: 0;

      color: #287734;

      font-size: 15px;
      font-weight: 600;
    }


    /* =========================================================
       HERO TEXT
    ========================================================= */

    .hero-copy {
      width: 100%;

      margin-top: 34px;
    }

    .hero-copy h2 {
      margin: 0;

      color: #063d2b;

      font-size: 35px;
      line-height: 1.08;

      font-weight: 900;

      letter-spacing: -.5px;
    }

    .hero-copy p {
      max-width: 330px;

      margin: 14px auto 0;

      color: #244137;

      font-size: 16px;
      line-height: 1.45;

      font-weight: 400;
    }


    /* =========================================================
       FEATURE CARDS
    ========================================================= */

    .features {
      width: 100%;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 8px;

      margin-top: 32px;
    }

    .feature {
      min-width: 0;
      min-height: 105px;

      padding: 13px 5px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 8px;

      border: 1px solid rgba(255,255,255,.80);

      border-radius: 18px;

      background: rgba(255,255,255,.78);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:
        0 7px 22px
        rgba(7,91,53,.10);
    }

    .feature-icon {
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home-icon {
      width: 34px;
      height: 34px;

      display: block;

      object-fit: contain;
    }

    .feature-text {
      color: #123c2a;

      font-size: 10px;
      line-height: 1.25;

      font-weight: 800;
    }


    /* =========================================================
       VEGETABLE / CRATE AREA
    ========================================================= */

    .vegetable-space {
      flex: 1;

      width: 100%;

      min-height: 285px;

      pointer-events: none;
    }


    /* =========================================================
       BOTTOM AREA
       No white background
    ========================================================= */

    .bottom-area {
      width: 100%;

      padding-top: 90px;

      position: relative;

      z-index: 5;
    }


    /* =========================================================
       GET STARTED BUTTON
    ========================================================= */

    .start-wrap {
      width: 100%;
    }

    .start {
      width: 92%;

      margin: 0 auto;

      padding: 17px 20px;

      border-radius: 999px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      font-size: 18px;
      font-weight: 900;

      letter-spacing: .3px;

      box-shadow:
        0 9px 25px
        rgba(7,91,53,.32);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .start:hover {
      box-shadow:
        0 11px 28px
        rgba(7,91,53,.38);
    }

    .start:active {
      transform: scale(.97);
    }

    .start-icon {
      width: 23px;
      height: 23px;

      display: block;

      filter:
        brightness(0)
        invert(1);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .foot {
      margin-top: 13px;

      color: #075b35;

      font-size: 13px;
      line-height: 1.3;

      font-weight: 700;

      text-shadow:
        0 1px 3px rgba(255,255,255,1),
        0 0 6px rgba(255,255,255,.95);
    }

    .foot-leaf {
      margin-right: 4px;
    }


    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 380px) {

      .home-content {
        padding: 38px 15px 16px;
      }

      .brand-row {
        gap: 8px;
      }

      .brand-logo {
        width: 50px;
        height: 50px;
      }

      .brand-main {
        font-size: 24px;
      }

      .brand-sub {
        font-size: 16px;

        letter-spacing: 5px;
      }

      .divider {
        width: 200px;

        margin-top: 17px;
      }

      .hero-copy {
        margin-top: 25px;
      }

      .hero-copy h2 {
        font-size: 30px;
      }

      .hero-copy p {
        max-width: 290px;

        font-size: 14px;
      }

      .features {
        gap: 6px;

        margin-top: 23px;
      }

      .feature {
        min-height: 90px;

        padding: 10px 3px;

        border-radius: 15px;
      }

      .feature-icon {
        height: 31px;
      }

      .home-icon {
        width: 30px;
        height: 30px;
      }

      .feature-text {
        font-size: 9px;
      }

      .vegetable-space {
        min-height: 220px;
      }

      .bottom-area {
        padding-top: 70px;
      }

      .start {
        padding: 15px 18px;

        font-size: 16px;
      }

      .start-icon {
        width: 21px;
        height: 21px;
      }

      .foot {
        font-size: 12px;
      }

    }


    /* =========================================================
       SHORT SCREENS
    ========================================================= */

    @media (max-height: 750px) {

      .home-content {
        padding-top: 30px;
      }

      .hero-copy {
        margin-top: 22px;
      }

      .features {
        margin-top: 20px;
      }

      .feature {
        min-height: 85px;
      }

      .vegetable-space {
        min-height: 175px;
      }

      .bottom-area {
        padding-top: 55px;
      }

    }

  </style>

</head>


<body>

  <main class="phone home">

    <div class="home-content">


      <!-- =========================================
           LOGO
      ========================================== -->

      <section class="brand">

        <div class="brand-row">

          <img
            src="/icons/logo-home.svg"
            alt="Food Quality Inspector Logo"
            class="brand-logo"
          >

          <div class="brand-text">

            <h1 class="brand-main">
              FOOD QUALITY
            </h1>

            <div class="brand-sub">
              INSPECTOR
            </div>

          </div>

        </div>


        <div class="divider">

          <span class="leaf">
            ❧
          </span>

        </div>


        <p class="tagline">
          Better Inspection. Better Quality.
        </p>

      </section>


      <!-- =========================================
           HERO
      ========================================== -->

      <section class="hero-copy">

        <h2>
          Fresh. Safe. Trusted.
        </h2>

        <p>
          Smart quality inspection
          for every fresh produce.
        </p>

      </section>


      <!-- =========================================
           FEATURES
      ========================================== -->

      <section class="features">


        <!-- CAPTURE IMAGE -->

        <div class="feature">

          <div class="feature-icon">

            <img
              src="/icons/camera-home.svg"
              alt="Capture Image"
              class="home-icon"
            >

          </div>

          <div class="feature-text">

            Capture
            <br>
            Image

          </div>

        </div>


        <!-- AI ANALYSIS -->

        <div class="feature">

          <div class="feature-icon">

            <img
              src="/icons/ai-home.svg"
              alt="Quality Assessment"
              class="home-icon"
            >

          </div>

          <div class="feature-text">

            Quality
            <br>
            Assessment

          </div>

        </div>


        <!-- QUALITY -->

        <div class="feature">

          <div class="feature-icon">

            <img
              src="/icons/shield-home.svg"
              alt="Quality Assessment"
              class="home-icon"
            >

          </div>

          <div class="feature-text">

            Quality
            <br>
            Assessment

          </div>

        </div>


        <!-- HISTORY -->

        <div class="feature">

          <div class="feature-icon">

            <img
              src="/icons/history-home.svg"
              alt="Inspection History"
              class="home-icon"
            >

          </div>

          <div class="feature-text">

            Inspection
            <br>
            History

          </div>

        </div>


      </section>


      <!-- =========================================
           VEGETABLE IMAGE SPACE
      ========================================== -->

      <div class="vegetable-space"></div>


      <!-- =========================================
           BOTTOM AREA
      ========================================== -->

      <section class="bottom-area">

        <div class="start-wrap">


          <!-- GET STARTED -->

          <button
            class="btn btn-primary start"
            id="startBtn"
            type="button"
          >

            <img
              src="/icons/camera-home.svg"
              alt=""
              class="start-icon"
            >

            <span>
              GET STARTED
            </span>

          </button>


          <!-- FOOTER -->

          <div class="foot">

            <span class="foot-leaf">
              🌱
            </span>

            Ensure Quality. Ensure Freshness.

          </div>


        </div>

      </section>


    </div>

  </main>


  <!-- YOUR EXISTING HOME JS -->

  <script src="/js/home.js"></script>


</body>

</html>
